<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .badge-container {
            width: 600px;
            height: 400px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
        }
        .badge-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .badge-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-description {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .badge-divider {
            width: 80%;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            margin: 20px 0;
        }
        .badge-user {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .badge-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .badge-date {
            font-size: 12px;
            opacity: 0.7;
        }
        .badge-footer {
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="badge-container">
        <div class="badge-icon">{{ badge_data.achievement_icon }}</div>
        <div class="badge-title">{{ badge_data.achievement_title }}</div>
        <div class="badge-description">{{ badge_data.achievement_description }}</div>
        
        <div class="badge-divider"></div>
        
        <div class="badge-user">Achieved by</div>
        <div class="badge-name">{{ badge_data.user_name }}</div>
        <div class="badge-date">{{ badge_data.date|date:"F d, Y" }}</div>
        
        <div class="badge-footer">Persona - Interview Preparation Platform</div>
    </div>
</body>
</html>
