<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: 18cm 12cm;
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Helvetica, Arial, sans-serif;
            background-color: #6c63ff;
            color: #ffffff;
        }
        .outer {
            width: 100%;
            height: 100%;
            background-color: #6c63ff;
            padding: 0;
        }
        table.layout {
            width: 100%;
            border-collapse: collapse;
        }
        /* Top accent bar */
        .accent-bar {
            background-color: #a78bfa;
            height: 8px;
        }
        /* Main content cell */
        .content-cell {
            padding: 36px 50px 20px 50px;
            text-align: center;
            vertical-align: middle;
        }
        .icon {
            font-size: 56px;
            line-height: 1.1;
            margin-bottom: 10px;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .description {
            font-size: 14px;
            color: #e0d7ff;
            margin-bottom: 20px;
        }
        .divider-cell {
            padding: 0 50px;
        }
        .divider-line {
            border-top: 1px solid rgba(255,255,255,0.35);
            margin: 0;
        }
        .user-cell {
            padding: 16px 50px 10px 50px;
            text-align: center;
        }
        .achieved-label {
            font-size: 11px;
            color: #c4b5fd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .user-name {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .user-date {
            font-size: 11px;
            color: #c4b5fd;
            margin-bottom: 0;
        }
        .footer-cell {
            padding: 10px 50px 20px 50px;
            text-align: center;
        }
        .footer-text {
            font-size: 10px;
            color: #a78bfa;
            letter-spacing: 0.5px;
        }
        /* Bottom accent bar */
        .bottom-bar {
            background-color: #a78bfa;
            height: 8px;
        }
    </style>
</head>
<body>
<div class="outer">
    <table class="layout" cellspacing="0" cellpadding="0">
        <!-- Top accent bar -->
        <tr><td class="accent-bar"></td></tr>

        <!-- Icon + Title + Description -->
        <tr>
            <td class="content-cell">
                <div class="icon">{{ badge_data.achievement_icon }}</div>
                <div class="title">{{ badge_data.achievement_title }}</div>
                <div class="description">{{ badge_data.achievement_description }}</div>
            </td>
        </tr>

        <!-- Divider -->
        <tr>
            <td class="divider-cell">
                <div class="divider-line"></div>
            </td>
        </tr>

        <!-- User info -->
        <tr>
            <td class="user-cell">
                <div class="achieved-label">Achieved by</div>
                <div class="user-name">{{ badge_data.user_name }}</div>
                <div class="user-date">{{ badge_data.date|date:"F d, Y" }}</div>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td class="footer-cell">
                <div class="footer-text">Persona &mdash; Interview Preparation Platform</div>
            </td>
        </tr>

        <!-- Bottom accent bar -->
        <tr><td class="bottom-bar"></td></tr>
    </table>
</div>
</body>
</html>
