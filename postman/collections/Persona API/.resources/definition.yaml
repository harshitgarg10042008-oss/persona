$kind: collection
name: 'Persona API'
description: 'Postman v3 local collection for discovered Django frontend, auth, and analysis endpoints.'
variables:
  - key: baseUrl
    value: 'http://localhost:8000'
  - key: job_role_id
    value: '1'
  - key: assessment_id
    value: '1'
  - key: session_id
    value: '00000000-0000-4000-8000-000000000000'
  - key: link_id
    value: 'sample-link-id'
  - key: uidb64
    value: 'sample-uidb64'
  - key: token
    value: 'sample-token'
