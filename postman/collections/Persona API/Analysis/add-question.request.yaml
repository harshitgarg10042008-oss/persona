$kind: http-request
method: POST
url: '{{baseUrl}}/analysis/job-roles/{{job_role_id}}/add-question/'
order: 6000
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
pathVariables:
  - key: job_role_id
    value: '{{job_role_id}}'
body:
  type: urlencoded
  content:
    - key: question
      value: 'Tell me about a time you solved a difficult backend bug.'
    - key: type
      value: 'behavioral'
