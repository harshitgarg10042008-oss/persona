$kind: http-request
method: POST
url: '{{baseUrl}}/analysis/business-snapshot/{{assessment_id}}/'
order: 12000
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
pathVariables:
  - key: assessment_id
    value: '{{assessment_id}}'
body:
  type: urlencoded
  content:
    - key: analysis_type
      value: 'body_language'
    - key: image_data
      value: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD...'
